; PlatformIO project config for RideToWooshHID
; ---------------------------------------------------------------------
; Works directly on the flat Arduino-style layout (no src/ folder) via
; src_dir = . — the same files also build in the Arduino IDE.
;
;   pio run                 build
;   pio run -t upload       flash (auto-detects the port)
;   pio device monitor      serial @115200
;
; The bundled partitions.csv (dedicated 'cfg' NVS) is used automatically.

[platformio]
src_dir = .

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
; compile the sketch in the repo root; don't recurse into asset/meta folders
build_src_filter = +<*> -<.git/> -<.pio/> -<images/> -<.github/> -<.claude/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; This board has 8 MB OPI PSRAM. It boots fine without it; to use it for
    ; extra heap headroom, uncomment the next line AND the memory_type below,
    ; then re-flash and confirm it still boots:
    ; -DBOARD_HAS_PSRAM
; board_build.arduino.memory_type = qio_opi
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    ESP32Async/ESPAsyncWebServer @ 3.12.0
    ESP32Async/AsyncTCP @ 3.5.0
    https://github.com/Berg0162/ESP32-NIMBLE-Keyboard.git#1f04c0496a398924bf321d7b27956beab485deb2
